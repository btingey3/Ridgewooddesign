<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#EDE8DF"/>
  <!-- grid -->
  <g stroke="#9E8B72" stroke-width="0.4" opacity="0.18">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/><line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/><line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="560" y1="0" x2="560" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
  </g>
  <!-- lot parcel -->
  <polygon points="150,90 660,75 700,390 110,410" fill="#E2DBD0" stroke="#9E8B72" stroke-width="2.5"/>
  <polygon points="150,90 660,75 700,390 110,410" fill="none" stroke="#7A6550" stroke-width="1.5" stroke-dasharray="14,7" opacity="0.7"/>
  <!-- internal division lines -->
  <line x1="405" y1="82" x2="405" y2="400" stroke="#9E8B72" stroke-width="1" stroke-dasharray="9,5" opacity="0.55"/>
  <line x1="130" y1="250" x2="700" y2="232" stroke="#9E8B72" stroke-width="1" stroke-dasharray="9,5" opacity="0.55"/>
  <!-- survey corner markers -->
  <g fill="#9E8B72" stroke="#7A6550" stroke-width="1.5">
    <circle cx="150" cy="90" r="7" fill="none"/><circle cx="150" cy="90" r="3" fill="#9E8B72"/>
    <circle cx="660" cy="75" r="7" fill="none"/><circle cx="660" cy="75" r="3" fill="#9E8B72"/>
    <circle cx="700" cy="390" r="7" fill="none"/><circle cx="700" cy="390" r="3" fill="#9E8B72"/>
    <circle cx="110" cy="410" r="7" fill="none"/><circle cx="110" cy="410" r="3" fill="#9E8B72"/>
  </g>
  <!-- trees top-left -->
  <ellipse cx="75" cy="80" rx="32" ry="28" fill="#C4B49A" opacity="0.28"/>
  <ellipse cx="55" cy="110" rx="25" ry="22" fill="#C4B49A" opacity="0.22"/>
  <ellipse cx="100" cy="60" rx="22" ry="20" fill="#C4B49A" opacity="0.2"/>
  <!-- trees top-right -->
  <ellipse cx="740" cy="65" rx="30" ry="26" fill="#C4B49A" opacity="0.28"/>
  <ellipse cx="765" cy="92" rx="22" ry="20" fill="#C4B49A" opacity="0.22"/>
  <!-- trees bottom -->
  <ellipse cx="400" cy="450" rx="26" ry="22" fill="#C4B49A" opacity="0.22"/>
  <ellipse cx="445" cy="458" rx="20" ry="18" fill="#C4B49A" opacity="0.18"/>
  <ellipse cx="355" cy="452" rx="22" ry="19" fill="#C4B49A" opacity="0.2"/>
  <!-- house footprint placeholder -->
  <rect x="295" y="185" width="230" height="155" rx="2" fill="#9E8B72" opacity="0.1" stroke="#9E8B72" stroke-width="1.5" stroke-dasharray="7,4"/>
  <!-- compass -->
  <g transform="translate(730,430)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#9E8B72" stroke-width="1" opacity="0.5"/>
    <polygon points="0,-18 -4,-7 4,-7" fill="#7A6550" opacity="0.75"/>
    <polygon points="0,18 -4,7 4,7" fill="#C4B49A" opacity="0.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#9E8B72" stroke-width="0.75" opacity="0.5"/>
    <text x="0" y="-22" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#7A6550" opacity="0.85">N</text>
  </g>
  <!-- dimension annotation -->
  <line x1="100" y1="435" x2="710" y2="435" stroke="#9E8B72" stroke-width="0.75" opacity="0.5"/>
  <line x1="100" y1="429" x2="100" y2="441" stroke="#9E8B72" stroke-width="0.75" opacity="0.5"/>
  <line x1="710" y1="429" x2="710" y2="441" stroke="#9E8B72" stroke-width="0.75" opacity="0.5"/>
  <text x="405" y="455" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7A6550" opacity="0.65" letter-spacing="3">175 FT</text>
</svg>
