<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8D1C4"/>
      <stop offset="100%" stop-color="#EDE8DF"/>
    </linearGradient>
    <linearGradient id="groundB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8BFB0"/>
      <stop offset="100%" stop-color="#B8AFA0"/>
    </linearGradient>
  </defs>
  <!-- sky -->
  <rect width="800" height="480" fill="url(#skyB)"/>
  <!-- ground -->
  <rect x="0" y="390" width="800" height="90" fill="url(#groundB)"/>

  <!-- background trees left -->
  <ellipse cx="60" cy="340" rx="38" ry="55" fill="#B8AFA0" opacity="0.35"/>
  <ellipse cx="110" cy="325" rx="30" ry="48" fill="#C4B49A" opacity="0.28"/>
  <!-- background trees right -->
  <ellipse cx="740" cy="335" rx="36" ry="52" fill="#B8AFA0" opacity="0.35"/>
  <ellipse cx="695" cy="320" rx="28" ry="46" fill="#C4B49A" opacity="0.28"/>

  <!-- House frame structure -->
  <!-- Foundation -->
  <rect x="150" y="370" width="500" height="22" fill="#9E8B72" opacity="0.5"/>

  <!-- Main floor walls - left wing -->
  <rect x="155" y="220" width="180" height="155" fill="none" stroke="#5C4A32" stroke-width="3"/>
  <!-- floor joists left -->
  <g stroke="#7A6550" stroke-width="1.5" opacity="0.5">
    <line x1="155" y1="290" x2="335" y2="290"/>
    <line x1="175" y1="220" x2="175" y2="375"/>
    <line x1="215" y1="220" x2="215" y2="375"/>
    <line x1="255" y1="220" x2="255" y2="375"/>
    <line x1="295" y1="220" x2="295" y2="375"/>
  </g>

  <!-- Main floor walls - center -->
  <rect x="335" y="170" width="130" height="205" fill="none" stroke="#5C4A32" stroke-width="3"/>
  <!-- floor joists center -->
  <g stroke="#7A6550" stroke-width="1.5" opacity="0.5">
    <line x1="335" y1="250" x2="465" y2="250"/>
    <line x1="335" y1="310" x2="465" y2="310"/>
    <line x1="365" y1="170" x2="365" y2="375"/>
    <line x1="405" y1="170" x2="405" y2="375"/>
    <line x1="440" y1="170" x2="440" y2="375"/>
  </g>

  <!-- Main floor walls - right wing -->
  <rect x="465" y="230" width="185" height="145" fill="none" stroke="#5C4A32" stroke-width="3"/>
  <!-- floor joists right -->
  <g stroke="#7A6550" stroke-width="1.5" opacity="0.5">
    <line x1="465" y1="300" x2="650" y2="300"/>
    <line x1="500" y1="230" x2="500" y2="375"/>
    <line x1="540" y1="230" x2="540" y2="375"/>
    <line x1="580" y1="230" x2="580" y2="375"/>
    <line x1="620" y1="230" x2="620" y2="375"/>
  </g>

  <!-- Roof trusses left -->
  <g stroke="#5C4A32" stroke-width="2.5" fill="none">
    <polygon points="155,220 335,220 245,120"/>
    <line x1="245" y1="120" x2="245" y2="220"/>
    <line x1="200" y1="170" x2="245" y2="145"/>
    <line x1="290" y1="170" x2="245" y2="145"/>
  </g>

  <!-- Roof trusses center (taller) -->
  <g stroke="#5C4A32" stroke-width="2.5" fill="none">
    <polygon points="335,170 465,170 400,55"/>
    <line x1="400" y1="55" x2="400" y2="170"/>
    <line x1="368" y1="113" x2="400" y2="92"/>
    <line x1="432" y1="113" x2="400" y2="92"/>
  </g>

  <!-- Roof trusses right -->
  <g stroke="#5C4A32" stroke-width="2.5" fill="none">
    <polygon points="465,230 650,230 557,135"/>
    <line x1="557" y1="135" x2="557" y2="230"/>
    <line x1="511" y1="183" x2="557" y2="158"/>
    <line x1="603" y1="183" x2="557" y2="158"/>
  </g>

  <!-- Ridge beam across top -->
  <line x1="245" y1="120" x2="400" y2="55" stroke="#7A6550" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="55" x2="557" y2="135" stroke="#7A6550" stroke-width="2" opacity="0.6"/>

  <!-- Scaffolding right side -->
  <g stroke="#9E8B72" stroke-width="1.5" opacity="0.6">
    <line x1="665" y1="390" x2="665" y2="200"/>
    <line x1="700" y1="390" x2="700" y2="200"/>
    <line x1="665" y1="390" x2="700" y2="390"/>
    <line x1="665" y1="340" x2="700" y2="340"/>
    <line x1="665" y1="290" x2="700" y2="290"/>
    <line x1="665" y1="240" x2="700" y2="240"/>
    <line x1="665" y1="200" x2="700" y2="200"/>
    <!-- diagonal braces -->
    <line x1="665" y1="340" x2="700" y2="390"/>
    <line x1="665" y1="290" x2="700" y2="340"/>
    <line x1="665" y1="240" x2="700" y2="290"/>
    <line x1="665" y1="200" x2="700" y2="240"/>
  </g>

  <!-- Construction measurement tape suggestion -->
  <g opacity="0.4">
    <line x1="150" y1="410" x2="650" y2="410" stroke="#9E8B72" stroke-width="0.75"/>
    <text x="400" y="428" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#7A6550" letter-spacing="3">9,600 SF</text>
  </g>

  <!-- Sun / light source top right -->
  <circle cx="720" cy="55" r="22" fill="#C4B49A" opacity="0.3"/>
  <g stroke="#C4B49A" stroke-width="1" opacity="0.35">
    <line x1="720" y1="20" x2="720" y2="10"/>
    <line x1="755" y1="55" x2="765" y2="55"/>
    <line x1="745" y1="30" x2="752" y2="23"/>
    <line x1="745" y1="80" x2="752" y2="87"/>
  </g>
</svg>
